<!DOCTYPE html>
<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


<title>PA#1</title>

<link rel="stylesheet" href="./style.css" />

<script src="./Utils/trackball-rotator.js"></script>
<script src="./Utils/m4.js"></script>
<script src="./shader.gpu"></script>
<script src="./Model.js"></script>
<script src="./StereoCamera.js"></script>
<script src="./Texture.js"></script>
<script src="./main.js"></script>

</head>
<body onload="init()">
        <div class="wrapper">
            <div class="text__container">
                <h2>Stereo Camera & WebCam Background</h2>
                <p id="message">
                    Drag your mouse on the canvas to rotate the model.<br />
                    (On a touch screen, you can use your finger.)
                </p>
            </div>

            <div class="main-content">
                <div id="canvas-holder">
                    <canvas width="800" height="600" id="webglcanvas" style="background-color: red"></canvas>
                </div>

                <div class="controls">
                    <div class="parameters__container">
                        <h3>Parameters</h3>
                        <div class="parameter-group">
                            <label for="eyeSep">Eye Separation: <span id="eyeSepVal">0.7</span></label>
                            <input type="range" id="eyeSep" min="0" max="2" step="0.01" value="0.7" oninput="updateParams()" />
                        </div>
                        <div class="parameter-group">
                            <label for="fov">Field of View: <span id="fovVal">0.4</span></label>
                            <input type="range" id="fov" min="0.1" max="2.0" step="0.01" value="0.4" oninput="updateParams()" />
                        </div>
                        <div class="parameter-group">
                            <label for="nearClip">Near Clipping: <span id="nearClipVal">8.0</span></label>
                            <input type="range" id="nearClip" min="1.0" max="15.0" step="0.1" value="8.0" oninput="updateParams()" />
                        </div>
                        <div class="parameter-group">
                            <label for="convergence">Convergence: <span id="convergenceVal">14.0</span></label>
                            <input type="range" id="convergence" min="5.0" max="30.0" step="0.1" value="14.0" oninput="updateParams()" />
                        </div>
                    </div>
                    <div class="button">
                        <button onclick="resetParameters()">Reset</button>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
